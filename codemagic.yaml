workflows:
  lucid-dream-android:
    name: Lucid Dream Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: 3.24.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean project
        script: flutter clean
      - name: Generate platform files
        script: flutter create .
      - name: Fix compileSdkVersion to 34
        script: perl -pi -e 's/.*flutter\.compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle
      - name: Fix Kotlin version to 1.9.22
        script: |
          perl -pi -e 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          perl -pi -e 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = "1.9.22"/' android/build.gradle
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build arm64 debug APK
        script: flutter build apk --debug --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - 2667958988@qq.com
